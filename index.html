<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurable Pac-Man</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Config Panel ──────────────────────────────────────────────────────── -->
  <div id="config-panel">
    <h1>PAC-MAN</h1>
    <h2>Game Settings</h2>

    <div class="control-group">
      <label for="lives">Lives <span class="range">(1–99)</span></label>
      <input type="number" id="lives" min="1" max="99" value="3" />
    </div>

    <div class="control-group">
      <label for="pellets">Power Pellets <span class="range">(0–10)</span></label>
      <input type="number" id="pellets" min="0" max="10" value="4" />
    </div>

    <div class="control-group">
      <label for="ghostSpeed">Ghost Speed <span class="range">(0.5×–2.0×)</span></label>
      <input type="range" id="ghostSpeed" min="0.5" max="2.0" step="0.1" value="1.0" />
      <span id="ghostSpeedVal">1.0×</span>
    </div>

    <div class="control-group">
      <label for="pacSpeed">Pac-Man Speed <span class="range">(0.5×–2.0×)</span></label>
      <input type="range" id="pacSpeed" min="0.5" max="2.0" step="0.1" value="1.0" />
      <span id="pacSpeedVal">1.0×</span>
    </div>

    <div class="control-group checkbox-group">
      <label for="invincible">Invincibility Mode</label>
      <input type="checkbox" id="invincible" />
    </div>

    <button id="start-btn" onclick="startGame()">▶ Start Game</button>
  </div>

  <!-- ── Game Container (Phaser mounts its canvas here) ───────────────────── -->
  <div id="game-container"></div>

  <!-- Phaser 3 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <!-- Game logic -->
  <script src="app.js"></script>

</body>
</html>
